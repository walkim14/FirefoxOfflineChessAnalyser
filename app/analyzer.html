<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Chess Analyzer</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/knight.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-shape shape-a"></div>
    <div class="bg-shape shape-b"></div>

    <main class="layout">
      <section class="board-panel">
        <header class="board-header">
          <h1>Offline Chess Analyzer</h1>
          <p>Review a game move by move, then play out your own lines from any position.</p>
        </header>

        <div class="board-frame">
          <div id="eval-bar" class="eval-bar" aria-label="Evaluation bar">
            <div id="eval-black" class="eval-black"></div>
            <div id="eval-white" class="eval-white"></div>
            <div id="eval-label" class="eval-label">=</div>
          </div>
          <div class="board-wrap">
            <div id="player-top" class="player-strip">Black -</div>
            <div id="board" class="board" aria-label="Chess board"></div>
            <svg id="board-overlay" class="board-overlay" viewBox="0 0 800 800" aria-hidden="true"></svg>
            <div id="player-bottom" class="player-strip">White -</div>
          </div>
        </div>

        <div class="controls-row">
          <button id="prev-btn" type="button">Prev</button>
          <button id="next-btn" type="button">Next</button>
          <button id="flip-btn" type="button">Flip</button>
          <button id="eval-mode-btn" type="button" aria-pressed="false">Eval: pawns</button>
          <label class="review-toggle" for="review-mode-toggle">
            <input id="review-mode-toggle" type="checkbox" />
            <span>Review mode</span>
          </label>
          <button id="reset-btn" type="button" class="danger">Reset line</button>
        </div>

        <div id="scan-progress-wrap" class="scan-progress hidden" aria-live="polite">
          <div class="scrub-head">
            <div id="scan-progress-label" class="scan-progress-label"></div>
            <div id="scrubber-label" class="scrubber-label">Move 0 / 0</div>
          </div>
          <div class="scrubber-shell">
            <div class="scan-progress-track">
              <div id="scan-progress-bar" class="scan-progress-bar"></div>
            </div>
            <input id="timeline-scrubber" class="timeline-scrubber" type="range" min="0" max="0" value="0" step="1" aria-label="Game timeline scrubber" />
          </div>
        </div>

        <div id="status" class="status">Engine booting...</div>
      </section>

      <section id="side-panel" class="side-panel">
        <div class="side-toolbar">
          <button id="toggle-side-btn" type="button">Hide controls</button>
        </div>

        <div class="card control-card">
          <h2>Import</h2>
          <label for="pgn-input">Game PGN</label>
          <textarea id="pgn-input" rows="7" placeholder="Paste a PGN to review"></textarea>
          <div class="card-actions">
            <button id="load-pgn-btn" class="primary" type="button">Load game</button>
          </div>

          <label for="fen-input">Or start from a position</label>
          <input id="fen-input" type="text" placeholder="Paste a FEN" />
          <div class="card-actions">
            <button id="load-fen-btn" type="button">Load position</button>
          </div>
        </div>

        <div class="card control-card">
          <h2>Theme</h2>
          <div class="settings-grid">
            <label for="board-style-select">Board</label>
            <select id="board-style-select">
              <option value="brown">Brown</option>
              <option value="green">Green</option>
              <option value="blue">Blue</option>
              <option value="marble">Marble</option>
              <option value="walnut">Walnut</option>
            </select>

            <label for="piece-style-select">Pieces</label>
            <select id="piece-style-select">
              <option value="neo">Neo</option>
              <option value="classic">Classic</option>
              <option value="wood">Wood</option>
              <option value="3d_wood">3D Wood</option>
              <option value="tournament">Tournament</option>
            </select>
          </div>
          <div class="card-actions">
            <button id="apply-theme-btn" type="button">Apply theme</button>
          </div>
        </div>

        <div class="card control-card">
          <h2>Analysis</h2>
          <div class="settings-grid">
            <label for="depth-input">Depth</label>
            <input id="depth-input" type="number" min="12" max="30" step="1" value="22" />

            <label for="review-depth-input">Review depth</label>
            <input id="review-depth-input" type="number" min="10" max="26" step="1" value="16" />

            <label for="multipv-input">Lines</label>
            <input id="multipv-input" type="number" min="1" max="4" step="1" value="3" />

            <label for="hash-input">Memory (MB)</label>
            <input id="hash-input" type="number" min="64" max="512" step="64" value="128" />

            <label for="elo-input">Your rating</label>
            <input id="elo-input" type="number" min="400" max="3000" step="50" value="1600" />
          </div>
          <div class="card-actions">
            <button id="apply-settings-btn" class="primary" type="button">Apply settings</button>
            <button id="analyze-btn" type="button">Analyze position</button>
          </div>
        </div>

        <div class="card collapsible-card" data-collapsible-card>
          <button class="card-toggle" type="button" data-collapsible-toggle aria-expanded="true" aria-controls="move-classification-content">
            <h2>Move quality</h2>
            <span class="card-toggle-icon" aria-hidden="true">▾</span>
          </button>
          <div id="move-classification-content" class="card-section-content" data-collapsible-content>
            <p id="classification-pill" class="pill neutral">No move classified yet</p>
            <div id="classification-meta" class="meta-list"></div>
          </div>
        </div>

        <div class="card collapsible-card" data-collapsible-card>
          <button class="card-toggle" type="button" data-collapsible-toggle aria-expanded="true" aria-controls="game-overview-content">
            <h2>Game review</h2>
            <span class="card-toggle-icon" aria-hidden="true">▾</span>
          </button>
          <div id="game-overview-content" class="card-section-content overview" data-collapsible-content>
            <div id="overview-heading" class="overview-heading"></div>
            <div class="overview-players">
              <div id="overview-white"></div>
              <div id="overview-black"></div>
            </div>
            <div id="overview-breakdown" class="overview-breakdown"></div>
          </div>
        </div>

        <div class="card collapsible-card" data-collapsible-card>
          <button class="card-toggle" type="button" data-collapsible-toggle aria-expanded="true" aria-controls="move-tree-content">
            <h2>Moves</h2>
            <span class="card-toggle-icon" aria-hidden="true">▾</span>
          </button>
          <div id="move-tree-content" class="card-section-content" data-collapsible-content>
            <div id="tree-path" class="tree-path"></div>
            <div id="tree-children" class="tree-children"></div>
          </div>
        </div>

        <div class="card collapsible-card" data-collapsible-card>
          <button class="card-toggle" type="button" data-collapsible-toggle aria-expanded="true" aria-controls="engine-lines-content">
            <h2>Engine lines</h2>
            <span class="card-toggle-icon" aria-hidden="true">▾</span>
          </button>
          <div id="engine-lines-content" class="card-section-content" data-collapsible-content>
            <div id="engine-lines" class="lines"></div>
          </div>
        </div>

      </section>
    </main>

    <div id="annotation-modal" class="annotation-modal hidden" aria-hidden="true">
      <div class="annotation-dialog" role="dialog" aria-modal="true" aria-labelledby="annotation-dialog-title">
        <div class="annotation-dialog-head">
          <h3 id="annotation-dialog-title">Sideline</h3>
          <button id="annotation-cancel-btn" type="button" class="annotation-close" aria-label="Close annotation dialog">×</button>
        </div>
        <label for="annotation-label-input">Label</label>
        <input id="annotation-label-input" type="text" placeholder="e.g. novelty, prep, tactical" />
        <label for="annotation-note-input">Note</label>
        <textarea id="annotation-note-input" rows="5" placeholder="Write a note for this sideline..."></textarea>
        <div class="annotation-actions">
          <button id="annotation-clear-btn" type="button" class="ghost">Clear</button>
          <button id="annotation-save-btn" type="button">Save</button>
        </div>
      </div>
    </div>

    <div id="promotion-modal" class="annotation-modal promotion-modal hidden" aria-hidden="true">
      <div class="annotation-dialog promotion-dialog" role="dialog" aria-modal="true" aria-labelledby="promotion-dialog-title">
        <h3 id="promotion-dialog-title">Promote to</h3>
        <div id="promotion-choices" class="promotion-choices"></div>
        <p class="promotion-hint">Press Q, R, B or N &middot; Esc to cancel</p>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
